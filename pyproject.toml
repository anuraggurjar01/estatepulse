[project]
name = "estatepulse-ai"
version = "1.0.0"
description = "EstatePulse AI: Enterprise-Grade Real Estate Valuation Engine & MLOps Pipeline featuring Real-Time Heuristics, AWS ECS Fargate, MLflow, and Streamlit"
readme = "README.md"
authors = [
    { name = "Anurag Gurjar", email = "anuraggurjar01@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = ["machine-learning", "mlops", "real-estate", "xgboost", "fastapi", "streamlit", "aws-ecs", "mlflow"]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40.33",
    "category-encoders>=2.8.1",
    "evidently>=0.7.12",
    "fastapi>=0.116.1",
    "great-expectations==1.5.8",
    "ipykernel>=6.30.1",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.5",
    "mlflow>=3.3.1",
    "nbformat>=5.10.4",
    "numpy==1.26.4",
    "optuna>=4.5.0",
    "pandas==2.1.1",
    "polars>=1.32.3",
    "pytest>=8.4.1",
    "scikit-learn>=1.7.1",
    "seaborn>=0.13.2",
    "streamlit>=1.48.1",
    "xgboost==3.0.4",
]


[tool.setuptools]
# This tells setuptools to look for your package inside src/
# pip install -e .
# This makes src/ packages (feature_pipeline, training_pipeline, Inference_pipeline) available as imports everywhere
# pytest -v
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
